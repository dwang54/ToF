; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = stm32cube

; Serial monitor for distance output
monitor_speed = 115200

; Upload & debug via the Nucleo's onboard ST-LINK
upload_protocol = stlink
debug_tool = stlink

; Include paths so your headers + HAL config resolve
build_flags =
    -I include
    -I lib/VL53L7CX/inc
    -Wl,-u_printf_float          ; enables %f in printf for distance logging
    -D SENSOR_VARIANT_CX
    ; -D SENSOR_VARIANT_CH

; Optional: faster iteration
build_type = debug